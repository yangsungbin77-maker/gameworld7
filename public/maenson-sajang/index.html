 muk:{ic:'🍜',name:'먹방',skill:'talk',skn:'말빨',pr:'리액션 연습',hp:4,cost:3,risk:[7,11],body:1,rk:'🤢 소화 불량',banWhy:'속이 안 좋아요',eff:s=>Math.min(100,35+s.talk*.65),mult:s=>.9,

function act(id){
  if(S.over||S.left<=0||$('modal').classList.contains('on'))return false;
  const x=XACT.find(v=>v.id===id);
  if(x){
    if((x.show&&!x.show(S))||x.lock(S)||S.hp<x.hp(S)||(x.cost&&S.money<x.cost))return false;
    go(ACTLOC[id]);S.hp-=x.hp(S);if(x.cost)S.money-=x.cost;sfx('skill');x.run(S);if(S.over)return true;
    S.left--;if(S.left===0)endDay();else render();return true;
  }
  const j=JOBS.find(x=>x.id===id), d=DREAM.find(x=>x.id===id), a=j||d;
  if(!a)return false;const cost=j?jobHp(S,j):d.hp(S);
  if((j?jobLock(S,j):a.lock(S))||S.hp<cost)return false;
  go(ACTLOC[id]);S.hp-=cost;
  if(j){
    const pay=jobPay(S,j);S.money+=pay;S.jobs++;S.jobEarn+=pay;sfx('coin');if(j.daily)S.used['j_'+j.id]=(S.used['j_'+j.id]||0)+1;
    say(j.ic,pick(j.txt),`<span class="up">+${won(pay)}</span> · 체력 -${cost}`);

    S.rests=(S.rests||0)+1;sfx('rest');const rg=35+(S.own.console?15:0);heal(S,rg);
    const cool=ch(S).body&&S.risk>0?Math.min(12,S.risk):0;S.risk-=cool;S.burn=Math.max(0,S.burn-12);
    say('😴',pick(S.own.console?['게임 한 판 하고 푹 쉬었어요.','보스를 잡고 기분이 좋아졌어요.']:['낮잠을 푹 잤어요.','라면 끓여 먹고 뒹굴었어요.','아무것도 안 하는 것도 일이에요.']),`체력 <span class="up">+${rg}</span>`+(cool?` · <span class="up">${ch(S).rk} -${cool}</span>`:''));

function pathOf(a,b){
  const A=PLACES[a],B=PLACES[b],pts=[door(a),[A.x,LINE[A.row]]];
  if(A.row!==B.row){pts.push([64,LINE[A.row]]);pts.push([64,LINE[B.row]])}

function along(pts,t){
  const seg=[];let tot=0;for(let i=1;i<pts.length;i++){const d=Math.abs(pts[i][0]-pts[i-1][0])+Math.abs(pts[i][1]-pts[i-1][1]);seg.push(d);tot+=d}
  let want=t*tot;for(let i=0;i<seg.length;i++){if(want<=seg[i]||i===seg.length-1){const r=seg[i]?Math.min(1,want/seg[i]):1;return[pts[i][0]+(pts[i+1][0]-pts[i][0])*r,pts[i][1]+(pts[i+1][1]-pts[i][1])*r,tot]}want-=seg[i]}
  return[...pts[pts.length-1],tot];
}

let decoMode=false,drag=null,sel=null;
const off=id=>S.pos[id]||[0,0];
function pieces(){
  const ps=FURN.filter(f=>f.show(S)).concat(DECO.filter(d=>S.deco[d.id]));
  const rank={wall:0,rug:1,floor:2};
  return ps.sort((a,b)=>rank[a.zone]-rank[b.zone]||(a.box[1]+a.box[3]+off(a.id)[1])-(b.box[1]+b.box[3]+off(b.id)[1]));
}
function drawHome(){
  const Rm=ROOMS[S.home];
  const W=WALLS.find(w=>w.id===S.wall)||WALLS[0],F=FLOORS.find(f=>f.id===S.floorSkin)||FLOORS[0];
  const wa=W.a||Rm.wall,wb=W.b||Rm.wall2,fa=F.a||Rm.floor,fb=F.b||Rm.line;
  // 벽
  px(0,0,128,48,wa);
  if(W.pat==='brick'){for(let y=0;y<48;y+=6){px(0,y+5,128,1,wb);for(let x=(y/6%2)*6;x<128;x+=12)px(x,y,1,5,wb)}}
  else for(let x=7;x<128;x+=16)px(x,0,1,48,wb);
  // 바닥
  px(0,48,128,24,fa);
  if(F.pat==='check'){for(let y=0;y<3;y++)for(let x=0;x<16;x++)if((x+y)%2)px(x*8,48+y*8,8,8,fb)}
  else for(let y=54;y<72;y+=6)px(0,y,128,1,fb);
  px(0,47,128,1,'#00000044');
  if(S.home===0){if(S.wall==='base'){px(100,4,9,6,'#5d584d');px(24,31,5,3,'#5d584d')}px(34,0,1,7,'#222');px(33,7,3,3,'#ffe9a0')}
  // 창문
  const [wx,wy,ww,wh]=Rm.win;const sky=S.left>=3?'#8fd0ff':S.left===2?'#ffd58f':'#f58f6a';
  px(wx-1,wy-1,ww+2,wh+2,'#f4f0e6');px(wx,wy,ww,wh,sky);
  const bc=S.home===2?'#3d4a7a':'#6f7890';
  for(let i=0;i<ww-4;i+=6){const bh=4+((i*7+S.home*3)%9);px(wx+i,wy+wh-bh,5,bh,bc);
    if(S.home===2)for(let k=1;k<bh-1;k+=3){px(wx+i+1,wy+wh-bh+k,1,1,'#ffe07a');px(wx+i+3,wy+wh-bh+k,1,1,'#ffe07a')}}
  if(S.own.car){const ax=wx+ww-11,ay=wy+wh-4;px(ax,ay,10,3,'#d33');px(ax+2,ay-2,6,2,'#d33');px(ax+3,ay-1,2,1,'#bdf');px(ax+6,ay-1,1,1,'#bdf');px(ax+1,ay+3,2,1,'#111');px(ax+7,ay+3,2,1,'#111')}
  px(wx+(ww>>1),wy,1,wh,'#f4f0e6');
  if(S.home>=1){px(wx-4,wy-2,3,wh+7,'#c96a6a');px(wx+ww+1,wy-2,3,wh+7,'#c96a6a')}
  // 가구·장식 (끌어서 옮긴 만큼 밀어서 그림)
  for(const p of pieces()){const [dx,dy]=off(p.id);cx.save();cx.translate(dx,dy);p.draw(S);cx.restore();
    if(decoMode&&sel===p.id&&p.id!=='me'){const [bx,by,bw,bh]=p.box;cx.strokeStyle='#ffc94a';cx.lineWidth=1;cx.setLineDash([2,2]);cx.strokeRect(bx+dx-.5,by+dy-.5,bw+1,bh+1);cx.setLineDash([])}}
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function movePiece(p,dx,dy){
  const [bx,by,bw,bh]=p.box;
  const nx=clamp(bx+dx,0,128-bw)-bx;
  const ny=p.zone==='wall'?clamp(by+dy,0,47-bh)-by:clamp(by+bh+dy,50,72)-(by+bh);
  S.pos[p.id]=[Math.round(nx),Math.round(ny)];
}
function cpos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*128,(e.clientY-r.top)/r.height*72]}
cv.addEventListener('pointerdown',e=>{
  if(!decoMode||!S||S.over)return;const [x,y]=cpos(e);
  const hit=pieces().filter(p=>p.id!=='me').filter(p=>{const [dx,dy]=off(p.id),[bx,by,bw,bh]=p.box;return x>=bx+dx-2&&x<=bx+dx+bw+2&&y>=by+dy-2&&y<=by+dy+bh+2}).sort((a,b)=>a.box[2]*a.box[3]-b.box[2]*b.box[3])[0];
  sel=hit?hit.id:null;
  if(hit){const o=off(hit.id);drag={p:hit,sx:x,sy:y,ox:o[0],oy:o[1]};try{cv.setPointerCapture(e.pointerId)}catch(_){}}
  drawRoom();e.preventDefault();
});
cv.addEventListener('pointermove',e=>{if(!drag)return;const [x,y]=cpos(e);movePiece(drag.p,drag.ox+x-drag.sx,drag.oy+y-drag.sy);drawRoom();e.preventDefault()});
const endDrag=()=>{drag=null};cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
function toggleDeco(on){decoMode=on===undefined?!decoMode:on;if(decoMode){peek=false;anim=null}sel=null;drag=null;render()}
$('decoBtn').onclick=()=>toggleDeco();
function buySkin(kind,id){
  const list=kind==='wall'?WALLS:FLOORS,it=list.find(x=>x.id===id),key=kind+'_'+id,field=kind==='wall'?'wall':'floorSkin';
  if(!it||S.over)return false;
  if(id!=='base'&&!S.own[key]){if(S.money<it.cost)return false;S.money-=it.cost;S.own[key]=true;say('🎨',`${it.name} ${kind==='wall'?'벽지':'바닥'}로 바꿨어요.`,`<span class="down">-${won(it.cost)}</span> · 아늑함이 올라요`)}
  S[field]=id;render();return true;
}
function buyDeco(id){
  const d=DECO.find(x=>x.id===id);if(!d||S.over||S.deco[id]||S.money<d.cost)return false;
  S.money-=d.cost;S.deco[id]=1;sel=id;say(d.ic,`${d.name} — 방에 놓았어요!`,`<span class="down">-${won(d.cost)}</span> · 끌어서 원하는 자리에 두세요`);render();return true;
}
function renderDeco(){
  const P=$('dpanel');$('decoBtn').className='decoBtn'+(decoMode?' on':'');$('decoBtn').textContent=decoMode?'✔ 꾸미기 끝':'🎨 꾸미기';
  document.querySelector('.room').classList.toggle('deco',decoMode);$('app').classList.toggle('decoing',decoMode);
  if(!decoMode){P.style.display='none';return}
  P.style.display='';P.innerHTML='';const c=comfort(S);
  const add=(tag,cls,txt)=>{const e=document.createElement(tag);e.className=cls;if(txt)e.textContent=txt;P.appendChild(e);return e};
  add('div','dhint',`방 안의 가구를 손가락으로 끌어서 옮겨요. 벽에 거는 건 벽에만, 바닥 물건은 바닥에만 놓여요. 아늑함 ${c} · 잘 때 체력 +${Math.min(10,c)} (최대 10)`);
  for(const [kind,label,list,cur,dflt] of [['wall','벽지',WALLS,S.wall,ROOMS[S.home].wall],['floor','바닥',FLOORS,S.floorSkin,ROOMS[S.home].floor]]){
    add('div','dlab',label);const row=add('div','sw');
    for(const it of list){const own=it.id==='base'||S.own[kind+'_'+it.id];const b=document.createElement('button');b.className='swb'+(cur===it.id?' on':'');
      b.innerHTML=`<i style="background:${it.a||dflt}"></i>${it.name}<br>${own?(cur===it.id?'사용 중':'있음'):it.cost+'만'}`;b.disabled=!own&&S.money<it.cost;b.onclick=()=>buySkin(kind,it.id);row.appendChild(b)}
  }
  add('div','dlab','장식 사기');const g=add('div','grid');
  for(const d of DECO){const own=S.deco[d.id];g.appendChild(btn('buy',d.ic,d.name,own?'방에 있어요 ✔':S.money<d.cost?`${won(d.cost)} · 돈이 모자라요`:`${won(d.cost)} · 아늑함 +1`,own||S.money<d.cost||S.over,()=>buyDeco(d.id)))}
  const row=add('div','tabs');
  const r=document.createElement('button');r.className='tab';r.textContent='↩️ 전부 원래 자리로';r.onclick=()=>{S.pos={};sel=null;render()};row.appendChild(r);
  const k=document.createElement('button');k.className='tab on';k.textContent='✔ 꾸미기 끝';k.onclick=()=>toggleDeco(false);row.appendChild(k);
}

  META.endings[t]=(META.endings[t]||0)+1;META.runs++;if(S.ch)META.chs[S.ch]=1;saveMeta();

function sfx(n){
  if(TEST||!META.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    for(const [f,t0,d,ty] of SFX[n]||[]){const o=AC.createOscillator(),g=AC.createGain(),at=AC.currentTime+t0;o.type=ty||'square';o.frequency.value=f;

}

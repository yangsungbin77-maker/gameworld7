<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>우리 아이 첫 피아노</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:'Jua';src:url('fonts/Jua-Regular.ttf') format('truetype');font-display:swap}
@font-face{font-family:'Gowun Dodum';src:url('fonts/GowunDodum-Regular.ttf') format('truetype');font-display:swap}
/* layout: one-screen practice room — controls on top, falling-note stage fills the rest, keyboard at the bottom of the stage */
:root{
  --bg:#141a2e; --panel:#1d2540; --line:#2c3657; --fg:#f3f1ea; --muted:#a3abc6; --accent:#f5c518;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif; --body:"Gowun Dodum",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
header{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;color:var(--accent);letter-spacing:.02em}
.chip{font:inherit;font-family:var(--display);font-size:15px;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.songsel{font-size:17px;padding:7px 14px;max-width:100%;color:var(--accent);border-color:var(--accent)}
.songsel option,.songsel optgroup{background:var(--panel);color:var(--fg)}
.streak{cursor:default;color:var(--accent)}
.stars{font-size:40px;letter-spacing:6px;color:var(--accent)}
.week{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.day{width:46px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.day b{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--panel);border:1.5px dashed var(--line);font-weight:400}
.day.on b{border:1.5px solid var(--accent)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.chip:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.speed{display:flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px}
.speed-label{font-family:var(--display);color:var(--muted)}
.speed output{font-family:var(--display);font-size:18px;min-width:3.4em;text-align:center;font-variant-numeric:tabular-nums}
.step{font:inherit;font-family:var(--display);font-size:24px;line-height:1;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.step:disabled{opacity:.35;cursor:default}
.step:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-family:var(--display);font-size:18px;border:none;border-radius:14px;padding:8px 18px;cursor:pointer;background:var(--panel);color:var(--fg);border:1.5px solid var(--line)}
.btn.main{background:var(--accent);color:#2a2105;border-color:var(--accent);min-width:7.5em}
.stage{position:relative;min-height:0;border-radius:16px;overflow:hidden;background:#0d1222;border:1.5px solid var(--line)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(13,18,34,.82);text-align:center;padding:16px}
.overlay p{margin:0;font-family:var(--display);font-size:28px}
.overlay small{color:var(--muted);font-size:15px;max-width:560px}
.field{font:inherit;width:min(520px,100%);padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);box-sizing:border-box}
footer{font-size:12px;color:var(--muted);line-height:1.5}
@media (max-width:560px){h1{font-size:20px}.btn{font-size:16px;padding:7px 14px}}
@media (max-width:760px),(max-height:700px){footer{display:none}}
/* one fixed screen: no page scroll, no zoom, no text selection (kids click everywhere) */
html,body{overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100dvh;max-height:100%}
input,textarea{-webkit-user-select:text;user-select:text}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}</style>
</head>
<body>


<div class="app">
  <header>
    <h1 id="appName" data-ko="첫 피아노" data-en="First Piano">첫 피아노</h1>
    <select id="songSel" class="chip songsel"></select>
    <span class="chip streak" id="streak"></span>
    <button class="chip" id="lang" aria-label="Language">EN</button>
    <div class="row">
      <div class="speed">
        <span class="speed-label" data-t="speed"></span>
        <button class="step" id="slower" aria-label="slower">−</button>
        <output id="speedOut"></output>
        <button class="step" id="quicker" aria-label="faster">+</button>
      </div>
      <button class="chip" id="mode" aria-pressed="false"></button>
      <button class="chip" id="loop" aria-pressed="false"></button>
      <button class="chip" id="fingers" aria-pressed="true"></button>
      <button class="chip" id="sound" aria-pressed="true"></button>
      <label class="chip" for="midi" id="midiLabel" data-t="midi"></label>
      <input id="midi" type="file" accept=".mid,.midi,audio/midi" hidden>
      <button class="chip" id="typeBtn" data-t="typeBtn"></button>
      <button class="btn" id="restart" data-t="restart"></button>
      <button class="btn main" id="play"></button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="startOv">
      <p id="ovTitle"></p>
      <small id="ovSub"></small>
      <button class="btn main" id="ovPlay"></button>
    </div>
    <div class="overlay" id="typeOv" hidden>
      <p data-t="typeTitle"></p>
      <small data-t="typeHelp"></small>
      <input id="typeTitle" class="field" type="text">
      <textarea id="typeText" class="field" rows="6"></textarea>
      <small id="typeErr" style="color:#ff8a7a"></small>
      <div class="row" style="justify-content:center">
        <button class="btn" id="typeCancel" data-t="cancel"></button>
        <button class="btn main" id="typeOk" data-t="addSong"></button>
      </div>
    </div>
    <div class="overlay" id="doneOv" hidden>
      <p data-t="done"></p>
      <div class="stars" id="doneStars"></div>
      <small id="doneMsg"></small>
      <div id="doneSticker" style="font-family:var(--display);font-size:20px"></div>
      <div class="week" id="week"></div>
      <div class="row" style="justify-content:center">
        <button class="btn" id="again" data-t="again"></button>
        <button class="btn main" id="faster" data-t="faster"></button>
      </div>
    </div>
  </div>

  <footer data-t="footer"></footer>
</div>

const store={get(k,d){try{const v=localStorage.getItem('slowpiano.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('slowpiano.'+k,JSON.stringify(v))}catch(e){}}};
let LANG=store.get('lang',null)||((navigator.language||'').toLowerCase().startsWith('ko')?'ko':'en');
const t=k=>T[LANG][k];
const songTitle=s=>LANG==='en'?(s.en||s.title):s.title;
const noteName=m=>t('names')[((m%12)+12)%12];

const COLORS=['#e8473d','#e8473d','#f28c28','#f28c28','#f5c518','#8bc34a','#8bc34a','#1fb3a6','#1fb3a6','#8e7cf0','#8e7cf0','#e055a6'];
const L={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const midi=n=>12*(+n.slice(-1)+1)+L[n[0]]+(n[1]==='#'?1:0);
const isBlack=m=>[1,3,6,8,10].includes(((m%12)+12)%12);
// right-hand fingering: keep the hand in a five-key position, move it only when a note falls outside,
// and pick the new position that covers the most upcoming notes (sharps use their natural key's slot)
const STEP=[0,0,1,1,2,3,3,4,4,5,5,6];
const dia=m=>Math.floor(m/12)*7+STEP[((m%12)+12)%12];
function assignFingers(ev){
 let thumb=null;
 const fits=(p,i)=>{let c=0;for(let j=i;j<ev.length;j++){const d=dia(ev[j].m);if(d<p||d>p+4)break;c++}return c};
 ev.forEach((e,i)=>{
  const d=dia(e.m);
  if(thumb===null||d<thumb||d>thumb+4){
   let best=d,bestScore=-1;
   for(let p=d-4;p<=d;p++){const sc=fits(p,i)*10-(thumb===null?0:Math.abs(p-thumb));if(sc>=bestScore){bestScore=sc;best=p}}
   thumb=best;
  }
  e.f=d-thumb+1;
 });
 return ev;
}
function parse(s){let tt=0;return s.trim().split(/\s+/).map(tok=>{const[p,b]=tok.split(':');const d=b?+b:1;if(p==='R'){tt+=d;return null}const e={m:midi(p),start:tt,dur:d};tt+=d;return e}).filter(Boolean)}

const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const st={song:SONGS[0],ev:[],beat:-4,playing:false,wait:false,waiting:false,next:0,speed:.5,sound:true,fingers:true,loop:false,keys:[],lo:60,hi:71,flash:{},done:false};

let ac=null;
function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(m,sec){if(!st.sound||!ac)return;const f=440*Math.pow(2,(m-69)/12),t0=ac.currentTime,len=Math.min(2,Math.max(.45,sec));
 const g=ac.createGain(),o=ac.createOscillator(),o2=ac.createOscillator(),g2=ac.createGain();
 o.type='triangle';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;g2.gain.value=.18;
 o.connect(g);o2.connect(g2).connect(g);g.connect(ac.destination);
 g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.32,t0+.012);g.gain.exponentialRampToValueAtTime(.001,t0+len);
 o.start(t0);o2.start(t0);o.stop(t0+len+.05);o2.stop(t0+len+.05)}

function buildKeys(){
 const ms=st.ev.map(e=>e.m);let lo=Math.min(...ms),hi=Math.max(...ms);
 lo=lo-((lo%12+12)%12);            // down to C
 hi=hi+(11-((hi%12+12)%12));        // up to B
 if(hi-lo<11)hi=lo+11;
 st.lo=lo;st.hi=hi;st.keys=[];
 const whites=[];for(let m=lo;m<=hi;m++)if(!isBlack(m))whites.push(m);
 const kbH=Math.min(170,Math.max(90,H*.24)),ww=W/whites.length,y=H-kbH;
 whites.forEach((m,i)=>st.keys.push({m,x:i*ww,w:ww,y,h:kbH,black:false}));
 for(let m=lo;m<=hi;m++)if(isBlack(m)){const left=st.keys.find(k=>k.m===m-1);if(left)st.keys.push({m,x:left.x+ww*.66,w:ww*.68,y,h:kbH*.6,black:true})}
}
const keyOf=m=>st.keys.find(k=>k.m===m);

function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);buildKeys()}

function load(song){
 st.song=song;st.ev=assignFingers(song.ev?song.ev.map(e=>({...e})):parse(song.s));st.beat=-4;st.next=0;st.waiting=false;st.playing=false;st.done=false;st.flash={};
 st.ev.forEach(e=>e.ok=false);
 $('songSel').value=song.id;
 $('ovTitle').textContent=songTitle(song);$('ovSub').textContent=t('ovSub');$('startOv').hidden=false;$('doneOv').hidden=true;setPlayLabel();
 store.set('song',song.id);resize();
}
function setPlayLabel(){$('play').textContent=st.playing?t('pause'):t('play');$('ovPlay').textContent=t('play')}
function play(){audio();$('startOv').hidden=true;$('doneOv').hidden=true;if(st.done){restart();}st.playing=true;setPlayLabel();try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}
function pause(){st.playing=false;setPlayLabel()}
function restart(){st.beat=-4;st.next=0;st.waiting=false;st.done=false;st.ev.forEach(e=>e.ok=false);st.flash={}}
const secPerBeat=()=>60/st.song.bpm/st.speed;
function hit(e){tone(e.m,e.dur*secPerBeat());st.flash[e.m]=performance.now()}
function proceed(){if(!st.waiting)return;const e=st.ev[st.next];e.ok=true;hit(e);st.next++;st.waiting=false}

function step(dt){
 if(!st.playing||st.waiting)return;
 st.beat+=dt*st.song.bpm/60*st.speed;
 while(st.next<st.ev.length&&st.ev[st.next].start<=st.beat){
  const e=st.ev[st.next];
  if(st.wait&&!e.ok){st.beat=e.start;st.waiting=true;break}
  hit(e);st.next++;
 }
 const last=st.ev[st.ev.length-1];
 if(st.next>=st.ev.length&&st.beat>last.start+last.dur+.6){const r=award();if(st.loop){restart();return}st.playing=false;st.done=true;setPlayLabel();showDone(r)}
}

// rewards: stars per song by speed, one sticker per practice day, streak of days
const STICKERS=['🐰','🐻','🐱','🐶','🦊','🐼','🐨','🐯','🦁','🐸','🐧','🐥','🦄','🐳','🐞','🌻','🍓','🍩','🚀','🌈'];
const dkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayKey=()=>dkey(new Date());
const starStr=n=>'★'.repeat(n)+'☆'.repeat(3-n);
function streakDays(){const sk=store.get('stickers',{});let d=new Date(),n=0;if(!sk[dkey(d)])d.setDate(d.getDate()-1);while(sk[dkey(d)]){n++;d.setDate(d.getDate()-1)}return n}
function refreshStreak(){$('streak').textContent=t('streak')(streakDays());$('streak').title=t('streakTip')}
function award(){
 const n=st.speed>=0.75?3:st.speed>=0.5?2:1;
 const stars=store.get('stars',{});const prev=stars[st.song.id]||0;if(n>prev){stars[st.song.id]=n;store.set('stars',stars)}
 const sk=store.get('stickers',{});const td=todayKey();let fresh=false;
 if(!sk[td]){const used=new Set(Object.values(sk).slice(-6));const pool=STICKERS.filter(x=>!used.has(x));sk[td]=pool[Math.floor(Math.random()*pool.length)];store.set('stickers',sk);fresh=true}
 const cnt=store.get('count',{});cnt[td]=(cnt[td]||0)+1;store.set('count',cnt);
 refreshLabels();refreshStreak();
 return {n,best:Math.max(n,prev),fresh,sticker:sk[td],count:cnt[td]};
}
let lastResult=null;
function showDone(r){
 lastResult=r;
 $('doneStars').textContent=starStr(r.n);
 $('doneMsg').textContent=r.n<3?t('more')(r.n):t('best');
 $('doneSticker').textContent=r.fresh?t('newSticker')(r.sticker):t('countToday')(r.count,r.sticker);
 const sk=store.get('stickers',{}),w=$('week');w.textContent='';
 for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dkey(d),el=document.createElement('div');el.className='day'+(sk[k]?' on':'');
  const b=document.createElement('b');b.textContent=sk[k]||'';el.appendChild(b);const s=document.createElement('span');s.textContent=i===0?t('today'):t('days')[d.getDay()];el.appendChild(s);w.appendChild(el)}
 $('doneOv').hidden=false;
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function draw(now){
 ctx.clearRect(0,0,W,H);
 const kbY=st.keys.length?st.keys[0].y:H*.76,ppb=Math.max(60,kbY/4.2);
 st.keys.filter(k=>!k.black).forEach((k,i)=>{ctx.fillStyle=i%2?'rgba(255,255,255,.025)':'rgba(255,255,255,0)';ctx.fillRect(k.x,0,k.w,kbY)});
 ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;
 for(let b=Math.ceil(st.beat);b<st.beat+kbY/ppb+1;b++){const y=kbY-(b-st.beat)*ppb;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 const target=st.waiting?st.ev[st.next]:null;
 st.ev.forEach(e=>{
  const k=keyOf(e.m);if(!k)return;
  const yBottom=kbY-(e.start-st.beat)*ppb,h=Math.max(18,e.dur*ppb-6),y=yBottom-h;
  if(y>kbY||yBottom<-10)return;
  ctx.globalAlpha=(e.start+e.dur<st.beat)?.25:1;
  const pad=Math.max(3,k.w*.1);
  ctx.fillStyle=COLORS[e.m%12];rr(k.x+pad,y,k.w-pad*2,Math.min(h,kbY-y),10);ctx.fill();
  if(target===e){ctx.strokeStyle='#fff';ctx.lineWidth=3+Math.sin(now/180)*1.5;rr(k.x+pad,y,k.w-pad*2,Math.min(h,kbY-y),10);ctx.stroke()}
  const fs=Math.min(30,Math.max(14,k.w*.38));
  if(h>fs+6){ctx.fillStyle='rgba(20,20,30,.85)';ctx.font=`${fs}px Jua, sans-serif`;ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(noteName(e.m),k.x+k.w/2,Math.min(yBottom,kbY)-6)}
  if(st.fingers&&e.f&&y<kbY-8){const r=Math.min(14,Math.max(9,k.w*.18)),cx=k.x+k.w/2,cy=Math.max(y,0)+r+4;
   ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#ffffff';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='rgba(20,20,30,.6)';ctx.stroke();
   ctx.fillStyle='#1a1a22';ctx.font=`${Math.round(r*1.3)}px Jua, sans-serif`;ctx.textBaseline='middle';ctx.fillText(e.f,cx,cy+1)}
  ctx.globalAlpha=1;
 });
 ctx.fillStyle='rgba(245,197,24,.9)';ctx.fillRect(0,kbY-3,W,3);
 const sounding=new Set();st.ev.forEach(e=>{if(e.start<=st.beat&&st.beat<e.start+e.dur&&(!st.wait||e.ok))sounding.add(e.m)});
 if(target)sounding.add(target.m);
 for(const k of st.keys){
  const on=sounding.has(k.m)||(st.flash[k.m]&&now-st.flash[k.m]<220);
  if(!k.black){
   ctx.fillStyle=on?COLORS[k.m%12]:'#f6f4ee';ctx.fillRect(k.x+1,k.y,k.w-2,k.h);
   ctx.fillStyle=on?'#1a1a22':'#6b7090';ctx.font=`${Math.min(24,k.w*.34)}px Jua, sans-serif`;ctx.textAlign='center';ctx.textBaseline='bottom';
   ctx.fillText(noteName(k.m),k.x+k.w/2,k.y+k.h-8);
   if(k.m%12===0){ctx.font='11px Gowun Dodum, sans-serif';ctx.fillStyle=on?'#1a1a22':'#9aa0b8';ctx.fillText('C'+(Math.floor(k.m/12)-1),k.x+k.w/2,k.y+k.h-8-Math.min(24,k.w*.34)-2)}
  }
 }
 for(const k of st.keys)if(k.black){const f=st.flash[k.m]&&now-st.flash[k.m]<220;ctx.fillStyle=f?'#555c7a':'#1b1d27';rr(k.x,k.y,k.w,k.h,4);ctx.fill()}
 if(st.playing&&st.beat<0){ctx.fillStyle='rgba(243,241,234,.9)';ctx.font='72px Jua, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(Math.ceil(-st.beat),W/2,kbY*.45)}
 const nx=st.ev[st.next];
 if(nx&&(st.playing||st.waiting)){ctx.font='18px Jua, sans-serif';ctx.textAlign='left';ctx.textBaseline='top';const label=st.waiting?t('pressNow')(noteName(nx.m)):t('next')(noteName(nx.m));
  const tw=ctx.measureText(label).width;ctx.fillStyle='rgba(13,18,34,.85)';rr(10,10,tw+24,34,17);ctx.fill();ctx.fillStyle=COLORS[nx.m%12];ctx.fillText(label,22,17)}
}

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;step(dt);draw(now);requestAnimationFrame(loop)}

cv.addEventListener('pointerdown',ev=>{
 audio();const r=cv.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;
 const k=[...st.keys.filter(k=>k.black),...st.keys.filter(k=>!k.black)].find(k=>x>=k.x&&x<=k.x+k.w&&y>=k.y&&y<=k.y+k.h);
 if(k){
  if(st.waiting&&st.ev[st.next].m===k.m){proceed();return}
  tone(k.m,.6);st.flash[k.m]=performance.now();return;
 }
 if(st.waiting)proceed();
});
window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();if(st.waiting)proceed();else st.playing?pause():play()}});

const SPEEDS=[0.25,0.3,0.35,0.4,0.45,0.5,0.6,0.7,0.75,0.8,0.9,1];
function setSpeed(v){

}

// MIDI import: the family's own file stays on this device only
function parseMidi(buf){
 const d=new DataView(buf);let p=0;
 const str=n=>{let s='';for(let i=0;i<n;i++)s+=String.fromCharCode(d.getUint8(p++));return s};
 const u32=()=>{const v=d.getUint32(p);p+=4;return v},u16=()=>{const v=d.getUint16(p);p+=2;return v};
 const vlq=()=>{let v=0,b;do{b=d.getUint8(p++);v=(v<<7)|(b&127)}while(b&128);return v};
 if(str(4)!=='MThd')throw new Error(t('notMidi'));
 const hl=u32();u16();const nt=u16(),div=u16();p=8+hl;
 if(div&0x8000)throw new Error(t('badMidi'));
 let tempo=500000;const notes=[];
 for(let tr=0;tr<nt&&p+8<=d.byteLength;tr++){
  const id=str(4),len=u32(),end=p+len;if(id!=='MTrk'){p=end;continue}
  let tick=0,run=0;const open={};
  while(p<end){
   tick+=vlq();let s=d.getUint8(p);if(s&128){p++;if(s<0xF0)run=s}else s=run;
   if(s===0xFF){const mt=d.getUint8(p++),l=vlq();if(mt===0x51&&tick===0)tempo=(d.getUint8(p)<<16)|(d.getUint8(p+1)<<8)|d.getUint8(p+2);p+=l}
   else if(s===0xF0||s===0xF7){p+=vlq()}
   else{const ty=s>>4,ch=s&15;
    if(ty===9||ty===8){const n=d.getUint8(p++),v=d.getUint8(p++),k=ch*128+n;
     if(ch===9)continue;
     if(ty===9&&v>0)open[k]=tick;else if(open[k]!==undefined){notes.push({m:n,start:open[k]/div,dur:Math.max(.1,(tick-open[k])/div)});delete open[k]}}
    else if(ty===0xC||ty===0xD)p+=1;else p+=2}
  }
  p=end;
 }
 if(!notes.length)throw new Error(t('noNotes'));
 notes.sort((a,b)=>a.start-b.start||b.m-a.m);
 const mel=[];for(const n of notes){const prev=mel[mel.length-1];if(prev&&Math.abs(prev.start-n.start)<.05)continue;mel.push({...n})}
 for(let i=0;i<mel.length-1;i++)mel[i].dur=Math.max(.1,Math.min(mel[i].dur,mel[i+1].start-mel[i].start));
 const t0=mel[0].start;mel.forEach(n=>n.start-=t0);
 return {ev:mel,bpm:Math.round(60e6/tempo)};
}
function addCustom(name,data,id='custom'){
 const s={id,lv:'mine',title:name,en:name,bpm:data.bpm,ev:data.ev};
 const i=SONGS.findIndex(x=>x.id===id);if(i>=0)SONGS.splice(i,1);SONGS.push(s);
 buildSongList();
 return s;
}
// typed notes: one note = one beat, ~ = hold one more beat, 높은도 / C5 = high C, brackets = read only inside, one beat rest between bracket groups
function parseSolfa(text){
 const SOL={'도':60,'레':62,'미':64,'파':65,'솔':67,'라':69,'시':71,'높은도':72,
  do:60,re:62,mi:64,fa:65,sol:67,so:67,la:69,ti:71,si:71,c:60,d:62,e:64,f:65,g:67,a:69,b:71,c5:72};
 const groups=/\(/.test(text)?[...text.matchAll(/\(([^)]*)\)/g)].map(m=>m[1]):[text];
 const ev=[];let tt=0;
 for(const g of groups){let any=false;
  for(const m of g.matchAll(/높은도|[도레미파솔라시]|C5|sol|do|re|mi|fa|so|la|ti|si|[A-G]|~/gi)){
   if(m[0]==='~'){if(ev.length)ev[ev.length-1].dur+=1,tt+=1;continue}
   const key=/[가-힣]/.test(m[0])?m[0]:m[0].toLowerCase();
   const note=SOL[key];if(note===undefined)continue;
   ev.push({m:note,start:tt,dur:1});tt+=1;any=true}
  if(any&&groups.length>1)tt+=1;
 }
 if(!ev.length)throw new Error(t('noSolfa'));
 return {ev,bpm:90};
}
$('typeBtn').addEventListener('click',()=>{pause();$('typeErr').textContent='';$('typeOv').hidden=false;$('typeTitle').focus()});
$('typeCancel').addEventListener('click',()=>{$('typeOv').hidden=true});
$('typeOk').addEventListener('click',()=>{
 const name=($('typeTitle').value.trim()||t('mySong')).slice(0,24);
 try{const data=parseSolfa($('typeText').value);store.set('typed',{name,data});$('typeOv').hidden=true;load(addCustom(name,data,'typed'));}
 catch(e){$('typeErr').textContent=e.message}
});
$('typeText').addEventListener('input',()=>{$('typeErr').textContent=''});
$('midi').addEventListener('change',async()=>{
 const f=$('midi').files[0];if(!f)return;
 try{const data=parseMidi(await f.arrayBuffer());const name=f.name.replace(/\.midi?$/i,'').slice(0,24);
  store.set('custom',{name,data});load(addCustom(name,data));}
 catch(e){$('ovTitle').textContent=t('cantRead');$('ovSub').textContent=(e.message||t('tryOther'));$('startOv').hidden=false}
 $('midi').value='';
});

st.wait=store.get('wait',false);st.sound=store.get('sound',true);st.fingers=store.get('fingers',true);st.loop=store.get('loop',false);st.speed=store.get('speed',.5);
const saved=store.get('custom',null);if(saved&&saved.data&&saved.data.ev)SONGS.push({id:'custom',lv:'mine',title:saved.name,en:saved.name,bpm:saved.data.bpm,ev:saved.data.ev});
const typed=store.get('typed',null);if(typed&&typed.data&&typed.data.ev)SONGS.push({id:'typed',lv:'mine',title:typed.name,en:typed.name,bpm:typed.data.bpm,ev:typed.data.ev});
st.song=SONGS.find(s=>s.id===store.get('song','star'))||SONGS[0];
applyLang();
load(st.song);
requestAnimationFrame(loop);
